<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="b1">Blue</button>
    <button id="b2">Red</button>
    <button id="b3">Green</button>

    <script>
        let btn1,btn2,btn3;
        btn1=document.getElementById('b1').addEventListener('click',display)
        btn2=document.getElementById('b2').addEventListener('click',display)
        btn3=document.getElementById('b3').addEventListener('click',display)

        function display(event){
            if(event.target.innerText=='Red'){
                document.body.style.backgroundColor='Red'
            }
            else if (event.target.innerText=='Blue'){
                document.body.style.backgroundColor='Blue'

            }
            else{
                document.body.style.backgroundColor='Green'
            }
        }
    </script>
    
</body>
</html>
